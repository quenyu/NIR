[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nir-dynamics-backend"
version = "0.1.0"
description = "Research-grade prototype backend for browser-based dynamic systems modeling."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn>=0.30.0",
  "numpy>=2.0.0",
  "scipy>=1.13.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
experiments = [
  "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares dependencies as Depends(...) defaults.
ignore = ["B008"]
